<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#4f46e5"/>
  <!-- connection lines -->
  <line x1="16" y1="7" x2="16" y2="16" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <line x1="7"  y1="25" x2="16" y2="16" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <line x1="25" y1="25" x2="16" y2="16" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <!-- satellite nodes -->
