version: "3.9"

networks:
  neuradesk-net:
    driver: bridge

volumes:
  postgres-data:

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuradesk
      POSTGRES_PASSWORD: neuradesk
      POSTGRES_DB: neuradesk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - neuradesk-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuradesk -d neuradesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Main FastAPI backend (port 8000) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /app/frontend/node_modules
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://neuradesk:neuradesk@db:5432/neuradesk
      ENTERPRISE_API_BASE_URL: http://enterprise-api:8001
    ports:
      - "8000:8000"
    networks:
      - neuradesk-net
    depends_on:
      db:
        condition: service_healthy

  # ── Mock enterprise API (port 8001) ───────────────────────────────────────
  enterprise-api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    command: uvicorn services.enterprise_api:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
      - ./services:/app/services
    env_file:
      - .env
    ports:
      - "8001:8001"
    networks:
      - neuradesk-net

  # ── React frontend (port 3000) ────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    networks:
      - neuradesk-net
    depends_on:
      - backend
    profiles:
      - frontend
